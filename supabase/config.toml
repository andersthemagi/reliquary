# Minimal Supabase CLI config, for `supabase link` and `supabase db push`
# (.github/workflows/deploy.yml). We don't run the local Supabase stack: tests
# use plain Postgres with supabase/tests/stub.sql, which is never pushed.
project_id = "reliquary"

[db]
major_version = 17

[db.seed]
enabled = false

# The search embedding function (docs/design.md, "Search"). It checks its
# own shared secret (EMBED_SECRET), so Supabase's JWT check is off: only
# the MCP server calls it, and it holds no Supabase JWT.
[functions.embed]
verify_jwt = false
