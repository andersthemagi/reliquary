# Tracker drift: every Monday, checks that each issue docs/public/roadmap.yml
# names still says what the roadmap says (scripts/tracker-drift.sh), and keeps
# one GitHub issue ("Tracker drift") in step with the result: opened (which
# emails the owner) when they disagree, rewritten while they still do, closed
# when they agree again. The PR rules in AGENTS.md ("Issues") stop most drift
# at the source; this catches what they miss, such as an issue closed by hand
# or a PR that shipped a feature without moving its roadmap item.
name: tracker-drift

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tracker-drift
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Keep one issue in step with the roadmap
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Tracker drift: the roadmap and the issues disagree"
          drift=$(scripts/tracker-drift.sh)
          open_issue=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -z "$drift" ]; then
            [ -z "$open_issue" ] || gh issue close "$open_issue" --comment "The roadmap and the issues agree again."
            exit 0
          fi
          # shellcheck disable=SC2016 # literal backticks: Markdown code spans
          body=$(printf '`docs/public/roadmap.yml` and the issues it names disagree:\n\n%s\n\nFix each at its source (the issue or the roadmap item, in a PR that says `Closes` or `Part of`); this issue closes itself on the next Monday run once they agree.' "$drift")
          if [ -n "$open_issue" ]; then
            gh issue edit "$open_issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
