# Deploys one release: migrations to Supabase, then both apps built from
# exactly the tagged commit and uploaded to their Netlify sites, then smoke
# checks that production's /version is that release. "Live" always equals a
# release: pushes to main only test (test.yml); release.yml turns merged
# release pull requests into tags. Plan: docs/research/hosting.md, sections
# 8, 10D and 11; how to release, redeploy and roll back: docs/ops/runbook.md,
# "Deploy".
#
# Runs when:
#   - a product release (tag vX.Y.Z, not cli-v...) is published: by
#     release-please with RELEASE_PLEASE_TOKEN, or by a person;
#   - release.yml starts it (without RELEASE_PLEASE_TOKEN, a release made
#     with GITHUB_TOKEN triggers no workflow), or a person does: Actions >
#     deploy > Run workflow on main, with the tag. That is also how to
#     redeploy a release, or roll back to an older one.
#
# Rolling back: migrations are forward-only, so deploying a tag older than
# the newest release skips migrations and deploys that tag's app code on
# today's schema. Fix forward with a new migration if the schema is the
# problem.
#
# An upload succeeding says nothing about whether the app boots (a missing
# required env var is a runtime failure, not a build one), so nothing goes to
# production unchecked: scripts/netlify-deploy.sh uploads each app as a draft
# deploy, which has an address of its own that production does not serve;
# scripts/deploy-check.sh runs against the two drafts; only when it passes
# does scripts/netlify-publish.sh make them the published deploys, and the
# same checks run once more against the live hostnames. A failing draft check
# leaves production on the previous release with nothing to roll back; a
# failing live check after publishing is DNS or certificates, not the app
# (the same code just passed on its draft address), and the runbook's
# "Redeploy or roll back" says what to do.
#
# The Netlify sites are not connected to the repository, on purpose:
# Netlify's own builds and build hooks build a branch's latest commit, never
# a pinned one, so this workflow builds the tagged checkout itself (Node 22,
# `npm ci && npm run build` in web/ and mcp/) and uploads the result with the
# Netlify CLI. Nothing else deploys: this workflow is the only path.
#
# Each stage skips with a notice until its settings exist. A stage with only
# some of its settings fails, naming what's missing (names only, never
# values).
#
#   stage    repository secrets and variables (Settings > Secrets and variables > Actions)
#   db       secret SUPABASE_DB_PASSWORD; variables SUPABASE_PROJECT_REF and
#            SUPABASE_POOLER_HOST (not secret). No Supabase access token: db
#            push goes straight to the session pooler
#   netlify  secret NETLIFY_AUTH_TOKEN (a Netlify personal access token of a
#            team member who can deploy both sites); variables
#            NETLIFY_SITE_WEB and NETLIFY_SITE_MCP (each site's API ID, Site
#            configuration > General > Site details; not secret)
#   smoke    variables WEB_URL, MCP_URL (origins, e.g. https://app.example.com);
#            secret KEEPALIVE_TOKEN if the MCP site has one
#
# First push (manual, once; hosting.md section 8, open question): before it,
# run this in the Supabase SQL editor as `postgres`:
#   begin; create role rq_probe nologin; grant authenticated to rq_probe; rollback;
# If it succeeds, the grants in 20260924130000 and 20260924140000 will too.
# If the probe is refused (PG 16+ needs ADMIN OPTION on `authenticated`, and
# `postgres` is not superuser), a later migration can't help: `db push`
# stops at the first failing file, and the grant is inside shipped ones.
# Then it's a design decision, not a patch: ask Supabase support to grant
# it, or have the apps become a role of our own instead of `authenticated`.
name: deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (vX.Y.Z). An older tag rolls back app code only; migrations never go backwards
        required: true
        type: string

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway through a migration.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Which release
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a product release tag: '$TAG' (want vX.Y.Z)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Which stages are configured
        id: cfg
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_WEB: ${{ vars.NETLIFY_SITE_WEB }}
          NETLIFY_SITE_MCP: ${{ vars.NETLIFY_SITE_MCP }}
          WEB_URL: ${{ vars.WEB_URL }}
          MCP_URL: ${{ vars.MCP_URL }}
        run: |
          # A value derived from a secret isn't masked by GitHub on its own:
          # the URL-encoded password.
          [ -z "$SUPABASE_DB_PASSWORD" ] ||
            echo "::add-mask::$(jq -rn --arg v "$SUPABASE_DB_PASSWORD" '$v|@uri')"

          # stage <name> <var>...: all set runs it, none set skips it,
          # some set is a configuration mistake.
          stage() {
            local name=$1 n=0 v missing=()
            shift
            for v in "$@"; do
              if [ -n "${!v}" ]; then n=$((n + 1)); else missing+=("$v"); fi
            done
            if [ "$n" = $# ]; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
              echo "- $name: runs" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$n" = 0 ]; then
              echo "$name=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=deploy $name skipped::not configured yet (${missing[*]})"
              echo "- $name: skipped, not configured (${missing[*]})" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=deploy $name misconfigured::missing ${missing[*]}"
              return 1
            fi
          }
          stage db SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF SUPABASE_POOLER_HOST
          stage netlify NETLIFY_AUTH_TOKEN NETLIFY_SITE_WEB NETLIFY_SITE_MCP
          stage smoke WEB_URL MCP_URL

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0 # every tag, to tell a rollback from the newest release
          persist-credentials: false

      - name: The tag is a release of this version
        id: rel
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          have=$(tr -d '[:space:]' < version.txt)
          if [ "$have" != "$VERSION" ]; then
            echo "::error::$TAG, but its version.txt says $have"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          newest=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ "$TAG" = "$newest" ]; then
            echo "rollback=false" >> "$GITHUB_OUTPUT"
            echo "- $TAG ($(git rev-parse --short HEAD)), the newest release" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rollback=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=rollback::$TAG is older than $newest: deploying its app code only, on the current schema (migrations are forward-only)"
            echo "- $TAG ($(git rev-parse --short HEAD)): rollback from $newest, migrations skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.cfg.outputs.db == 'true' && steps.rel.outputs.rollback == 'false'
        with:
          version: 2.117.0

      - name: Database URL (session pooler; masked)
        if: steps.cfg.outputs.db == 'true' && steps.rel.outputs.rollback == 'false'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
          HOST: ${{ vars.SUPABASE_POOLER_HOST }}
        run: |
          pw=$(jq -rn --arg v "$SUPABASE_DB_PASSWORD" '$v|@uri')
          url="postgresql://postgres.$REF:$pw@$HOST:5432/postgres"
          echo "::add-mask::$url"
          echo "DB_URL=$url" >> "$GITHUB_ENV"

      - name: Migrations, dry run
        if: steps.cfg.outputs.db == 'true' && steps.rel.outputs.rollback == 'false'
        run: supabase db push --db-url "$DB_URL" --dry-run

      - name: Migrations
        if: steps.cfg.outputs.db == 'true' && steps.rel.outputs.rollback == 'false'
        run: supabase db push --db-url "$DB_URL" --yes

      - uses: actions/setup-node@v7
        if: steps.cfg.outputs.netlify == 'true'
        with:
          node-version: 22

      - name: Build both apps from the tagged commit (web, mcp)
        if: steps.cfg.outputs.netlify == 'true'
        env:
          # The build stamp (stamp-version.mjs) names this commit in /version.
          COMMIT_REF: ${{ steps.rel.outputs.sha }}
        run: |
          # The function ships node_modules/ as included files (netlify.toml),
          # so the dev dependencies (tsc) go after the build.
          for app in web mcp; do
            (cd "$app" && npm ci && npm run build && npm prune --omit=dev)
          done

      - name: Netlify draft deploys of the tagged commit (web, mcp)
        id: draft
        if: steps.cfg.outputs.netlify == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE_WEB: ${{ vars.NETLIFY_SITE_WEB }}
          SITE_MCP: ${{ vars.NETLIFY_SITE_MCP }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.rel.outputs.sha }}
          DEPLOYS_FILE: deploys.txt
        run: ./scripts/netlify-deploy.sh "$TAG" "$SHA" "web=$SITE_WEB" "mcp=$SITE_MCP"

      - name: Smoke checks against the drafts (their /version is this release)
        if: steps.cfg.outputs.netlify == 'true'
        env:
          WEB_URL: ${{ steps.draft.outputs.web_url }}
          MCP_URL: ${{ steps.draft.outputs.mcp_url }}
          KEEPALIVE_TOKEN: ${{ secrets.KEEPALIVE_TOKEN }}
          EXPECT_VERSION: ${{ steps.tag.outputs.version }}
          EXPECT_COMMIT: ${{ steps.rel.outputs.sha }}
        run: ./scripts/deploy-check.sh

      - name: Publish the drafts (production now serves this release)
        if: steps.cfg.outputs.netlify == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          mapfile -t deploys < deploys.txt
          ./scripts/netlify-publish.sh "${deploys[@]}"

      - name: Smoke checks against the live hostnames (live /version is this release)
        if: steps.cfg.outputs.smoke == 'true'
        env:
          WEB_URL: ${{ vars.WEB_URL }}
          MCP_URL: ${{ vars.MCP_URL }}
          KEEPALIVE_TOKEN: ${{ secrets.KEEPALIVE_TOKEN }}
          EXPECT_VERSION: ${{ steps.tag.outputs.version }}
          EXPECT_COMMIT: ${{ steps.rel.outputs.sha }}
        run: ./scripts/deploy-check.sh
