# What shouldn't reach a public repo, caught before it does: a live secret
# in a diff, or a high/critical dependency vulnerability. Runs on every push
# and pull request, same triggers as test.yml, kept separate since it's a
# different concern (what's safe to expose, not whether the product works).
name: security

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push cancels the older run of the same branch or pull request,
  # except on main: the secret scan covers only the commits of its own push,
  # so a run cancelled there leaves its commits unchecked for good. The
  # run id gives every push to main a group of its own.
  group: security-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secrets:
    # TruffleHog's official action always runs the CLI with --fail, which
    # exits non-zero on ANY finding, verified or not (confirmed 2026-09-29:
    # the action failed a plain dependency-bump PR on the same 5 unverified
    # fixtures the local scan already knew about, 0 verified). extra_args:
    # --results=verified is what actually restricts that to a verified
    # secret only, so a fixture like a fake Postgres URL in a test file
    # doesn't block a PR. Scans the pushed commits on a push, the PR's diff
    # against its base on a pull request (the action's own default
    # behaviour from the GitHub Actions context).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          extra_args: --results=verified

  audit:
    # npm audit, full dependency tree, dev included (a compromised
    # build-time package can still taint what ships). The CLI's own publish
    # already gates on this (publish-cli.yml, since 2026-09-29); this job
    # catches web/ and mcp/ too, and catches it on every push and PR, not
    # only at release time.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [web, mcp, cli]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - working-directory: ${{ matrix.package }}
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
