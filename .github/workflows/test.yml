# The regression suite on every push and pull request. Make "test" and
# "guard" required status checks on main (Settings > Branches) so nothing
# merges red. Policy: docs/research/testing-strategy.md.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push cancels the older run of the same branch or pull request,
  # except on main: the guard job compares only the commits of its own push,
  # so a run cancelled there leaves its commits unchecked for good. The
  # run id gives every push to main a group of its own.
  group: test-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guard:
    # Existing tests change only with a Changes-behaviour or Test-refactor
    # trailer. Checks the commits a PR adds, or the commits a push adds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Registry maps every test file
        run: ./scripts/check-registry.sh
      - name: Existing tests changed only on purpose
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            ./scripts/test-guard.sh "$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            ./scripts/test-guard.sh "$BEFORE"
          else
            echo "new branch or rewritten history: comparing with origin/main"
            ./scripts/test-guard.sh origin/main
          fi
      - name: Migrations are never edited, and a new one sorts last
        env:
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=origin/main
          # On a push to main, origin/main is HEAD by now: compare with where
          # main was, which also catches two pull requests that were each
          # fine against the main they were tested on.
          if [ "$REF" = refs/heads/main ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          fi
          ./scripts/check-migrations.sh "$base"
      - name: The scripts' own tests
        run: for t in scripts/*.test.sh; do "$t"; done

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Docker is the well-trodden engine on GitHub runners; the scripts use
      # podman when it's installed unless told otherwise.
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v7
      - name: All suites (sql, mcp, web) in parallel
        run: ./test.sh

  deploy:
    # Self-hosting end to end (deploy/test.sh, not part of ./test.sh): builds
    # the web and MCP images, brings deploy/compose up on its own network
    # with a mail catcher, makes the first owner, signs in with the emailed
    # code, creates a vault and a token, and writes a file over MCP.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v7
      - name: Self-hosting smoke test
        run: ./deploy/test.sh

  cli-changes:
    # Whether cli-unit runs: only when the commits change cli/ (or this
    # file), and always on a release pull request (release-please's
    # branches), so the matrix stays cheap.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ] && [[ "$HEAD_REF" == release-please--* ]]; then
            echo "release pull request"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            base=$(git merge-base origin/main HEAD)
            # A push to main itself with no usable "before": the last commit.
            [ "$base" != "$(git rev-parse HEAD)" ] || base=HEAD~1
          fi
          if git diff --quiet "$base" HEAD -- cli/ .github/workflows/test.yml; then
            echo "no change under cli/ since $base"; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "cli/ changed since $base"; echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  cli-unit:
    # The CLI's unit tests (cd cli && npm test: no containers, no servers) on
    # every OS people run it on. The end-to-end suite is ./cli/test.sh, in
    # the test job.
    needs: cli-changes
    if: needs.cli-changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm test
