# Every PR is squash-merged with the PR title as the squash commit's
# subject (merge commits and rebase merges are disabled at the repo level),
# so the title, not any individual commit inside the PR, is the one
# conventional-commit line release-please ever sees. This lints it on open
# and on every edit, instead of finding out at merge time.
#
# Types match release-please-config.json's changelog-sections (the ones
# release-please would otherwise silently drop into "Miscellaneous" or, for
# an unrecognised type, refuse to parse). AGENTS.md's Conventions section
# has the full policy and the incident this replaced
# (docs/ops/runbook.md, "Rules that came from incidents").
name: pr-title

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read
  statuses: write

jobs:
  lint:
    # release-please's own pull requests are titled "Release v1.2.3", which
    # is not a conventional commit and doesn't need to be: its squash commit
    # is the release itself. Skipped only for a branch in this repository, so
    # a fork can't dodge the lint by naming its branch release-please--x.
    if: github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            security
            perf
            revert
            docs
            refactor
            style
            test
            build
            ci
            chore
          requireScope: false
          # "feat!:" / "fix(web)!:" — a breaking change footer alone isn't
          # visible in a title, so the ! is how release-please (and this
          # check) can tell from the subject line alone.
          wip: false
          validateSingleCommit: false
