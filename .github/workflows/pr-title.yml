# Every PR is squash-merged with the PR title as the squash commit's
# subject (merge commits and rebase merges are disabled at the repo level),
# so the title, not any individual commit inside the PR, is the one
# conventional-commit line release-please ever sees. This lints it on open
# and on every edit, instead of finding out at merge time.
#
# Types match release-please-config.json's changelog-sections (the ones
# release-please would otherwise silently drop into "Miscellaneous" or, for
# an unrecognised type, refuse to parse). AGENTS.md's Conventions section
# has the full policy and the incident this replaced
# (docs/ops/runbook.md, "Rules that came from incidents").
#
# The second job, issue-line, fails a PR whose description doesn't say which
# issue it is for (AGENTS.md, "Issues"): issues stayed open after the work
# shipped because nothing in a PR ever named them.
name: pr-title

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read
  statuses: write

jobs:
  lint:
    # release-please's own pull requests are titled "Release v1.2.3", which
    # is not a conventional commit and doesn't need to be: its squash commit
    # is the release itself. Skipped only for a branch in this repository, so
    # a fork can't dodge the lint by naming its branch release-please--x.
    if: github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            security
            perf
            revert
            docs
            refactor
            style
            test
            build
            ci
            chore
          requireScope: false
          # "feat!:" / "fix(web)!:" — a breaking change footer alone isn't
          # visible in a title, so the ! is how release-please (and this
          # check) can tell from the subject line alone.
          wip: false
          validateSingleCommit: false

  issue-line:
    # Same exemption as the title lint, plus Dependabot, whose PRs have no issue.
    if: (github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-please--')) && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The description names an issue
        env:
          # Through the environment, never interpolated into the script: a PR
          # title and description are untrusted text.
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n' "$BODY" | grep -qiE '^[[:space:]]*(closes|fixes|resolves|part of|refs?) #[0-9]+'; then
            exit 0
          fi
          # A feature is logged work: it says which issue, never "No issue".
          if ! printf '%s\n' "$TITLE" | grep -qE '^feat' &&
             printf '%s\n' "$BODY" | grep -qiE '^[[:space:]]*no issue: *[^[:space:]]'; then
            exit 0
          fi
          echo '::error::Say which issue this PR is for, on a line of its own in the description: "Closes #N", "Part of #N", or (not for a feat PR) "No issue: <why>". A feature without an issue: open one first. AGENTS.md, "Issues".'
          exit 1
