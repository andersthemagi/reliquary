# Releases (docs/ops/runbook.md, "Deploy"). On every push to main,
# release-please (release-please-config.json, .release-please-manifest.json)
# keeps one pull request open per component, collecting the changelog from
# conventional commits:
#
#   "Release vX.Y.Z"      the product (web, MCP, database): version.txt,
#                         CHANGELOG.md, web/ and mcp/ package versions
#   "Release cli vX.Y.Z"  the CLI (cli/): cli/package.json, cli/CHANGELOG.md
#
# Merging one makes release-please tag it (vX.Y.Z or cli-vX.Y.Z) and publish
# its GitHub Release (a prerelease while the version is 0.x: pre-alpha). Then:
#   - a product release gets its migrations and a deploy note
#     appended to its notes (scripts/release-notes.sh), and deploy.yml
#     deploys exactly that tag;
#   - a CLI release runs publish-cli.yml for that tag.
#
# Tokens. With only GITHUB_TOKEN, what release-please creates triggers no
# other workflow (GitHub's rule against loops): no `test` run on the release
# pull request, no `release: published` for deploy.yml, no tag push for
# publish-cli.yml. So without RELEASE_PLEASE_TOKEN this workflow starts the
# deploy and the CLI publish itself (workflow_dispatch is exempt from that
# rule). With RELEASE_PLEASE_TOKEN (a fine-grained token or GitHub App token
# with contents and pull requests read and write on this repository), the
# events fire as usual and this workflow starts nothing itself.
#
# Repository setting (Settings > Actions > General > Workflow permissions):
# "Allow GitHub Actions to create and approve pull requests" must be on.
#
# The first release, v0.1.0, is cut by hand (runbook); until a v* tag exists
# this workflow skips, so release-please doesn't propose a version for the
# whole history.
#
# Hotfix alert (docs/ops/runbook.md, "Hotfix"). A commit pushed to main with
# a `Hotfix: <why>` trailer opens or comments on the issue "Release ready:
# urgent fix waiting", naming the release pull request and the reason —
# that's the ping (GitHub's own issue-notification email), not a separate
# deploy path. When a push instead *is* release-please's own merge
# (release_created), that issue closes: the fix is live.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # tags, releases, the release branch
  pull-requests: write # the release pull requests
  issues: write # labels on them
  actions: write # gh workflow run (deploy, publish-cli)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, and the migrations between two of them

      - name: Has the first release been cut
        id: cut
        run: |
          if git tag -l 'v[0-9]*' | grep -q .; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=release skipped::no v* tag yet: cut v0.1.0 by hand first (docs/ops/runbook.md, Deploy)"
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        if: steps.cut.outputs.ok == 'true'
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Release notes (pre-alpha, migrations, deploy)
        if: steps.rp.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          git fetch --tags --force --quiet origin # the tag release-please just made
          ./scripts/release-notes.sh --apply "$TAG"

      - name: Start the deploy
        if: steps.rp.outputs.release_created == 'true' && env.HAS_RELEASE_TOKEN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
          echo "Deploy of $TAG started: Actions > deploy" >> "$GITHUB_STEP_SUMMARY"

      - name: Start the CLI publish
        if: steps.rp.outputs['cli--release_created'] == 'true' && env.HAS_RELEASE_TOKEN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs['cli--tag_name'] }}
        run: |
          gh workflow run publish-cli.yml -R "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "CLI publish of $TAG started: Actions > publish-cli" >> "$GITHUB_STEP_SUMMARY"

      - name: "Hotfix alert (a pushed commit carries a Hotfix: trailer)"
        if: github.event_name == 'push' && steps.rp.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "no previous commit to diff from; skipping"; exit 0
          fi
          # Real trailers only (git parses the message's last paragraph), same
          # as scripts/test-guard.sh does for Changes-behaviour/Test-refactor.
          reasons=$(git log --format='%(trailers:key=Hotfix,valueonly)' "$BEFORE"..HEAD | sed '/^$/d')
          if [ -z "$reasons" ]; then
            echo "no Hotfix: trailer in this push"; exit 0
          fi

          title="Release ready: urgent fix waiting"
          pr_json=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --json number,url,title \
            -q '[.[] | select(.title | test("^Release v[0-9]"))][0]')
          # shellcheck disable=SC2016 # literal backticks: a Markdown code block
          body=$(printf 'A commit just pushed to main carries a `Hotfix:` trailer:\n\n```\n%s\n```\n\n' "$reasons")
          if [ -n "$pr_json" ] && [ "$pr_json" != "null" ]; then
            pr_url=$(jq -r .url <<< "$pr_json")
            pr_num=$(jq -r .number <<< "$pr_json")
            # shellcheck disable=SC2016 # literal backticks: an inline code span
            body+=$(printf 'Release pull request: %s\n\nMerge it to deploy: `gh pr merge %s --squash` (docs/ops/runbook.md, "Hotfix").' "$pr_url" "$pr_num")
          else
            body+="No open release pull request yet; release-please should open or update one from this push shortly (Actions > release)."
          fi

          open_issue=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Close the hotfix alert (this push was the release)
        if: steps.rp.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          title="Release ready: urgent fix waiting"
          open_issue=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          [ -z "$open_issue" ] || gh issue close "$open_issue" -R "$GITHUB_REPOSITORY" --comment "Released as $TAG."
