# The workflows and the shell scripts, checked by tools instead of by hand.
# actionlint also shellchecks every `run:` step; shellcheck covers the
# scripts (the ones that run as root against production and the test
# harness). Settings for shellcheck: .shellcheckrc.
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The image, not the install script: a tag plus the digest it had when
      # this was written, so the linter can't change under a pull request.
      # Bump both together. Through Google's public Docker Hub mirror, so the
      # anonymous pull limit never fails the job (#232); the digest is the same.
      - name: Workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo mirror.gcr.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  shellcheck:
    # The runner's own shellcheck. Errors and warnings both block; info and
    # style notes are left out.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Warnings
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning
