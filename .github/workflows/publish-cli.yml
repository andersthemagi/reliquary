# Publishes the CLI (cli/, @reliquary-ai/cli) to npm for a tag cli-v<version>.
# Tags come from releases: merging release-please's "Release cli vX.Y.Z" pull
# request tags it (.github/workflows/release.yml); a tag pushed by a person
# or by RELEASE_PLEASE_TOKEN starts this workflow, and without that token
# release.yml starts it itself for the tag. To publish (or retry) a tag
# that exists: Actions > publish-cli > Run workflow, "Use workflow from" the
# tag (e.g. cli-v0.1.0). The tag must match cli/package.json's version
# (release-please keeps them in step). The CLI's end-to-end tests run first,
# then `npm audit --audit-level=high` on the full dependency tree (the CLI
# ships with none at runtime, but a compromised build-time dependency could
# still taint dist/); a high or critical finding fails the run before
# anything is published. The package is published without npm provenance,
# which needs a public source repository (this one is private).
#
# Auth: npm trusted publishing (OIDC, docs.npmjs.com/trusted-publishers),
# not a stored token. npm CLI tries OIDC first, using the id-token: write
# permission below, and only falls back to NPM_TOKEN (Settings > Secrets
# and variables > Actions) if OIDC isn't configured or fails. That fallback
# exists for exactly one reason: npm's trusted-publisher form lives on the
# package's own settings page, which can't exist before a first publish
# creates it, so the very first publish of @reliquary-ai/cli needs a
# one-time granular token (scoped to that package only). Once it exists:
# npmjs.com > @reliquary-ai/cli > Settings > Trusted publishing > GitHub
# Actions, with organization/user andersthemagi, repository reliquary,
# workflow filename publish-cli.yml, no environment. Then delete NPM_TOKEN
# (Settings > Secrets and variables > Actions) and revoke the npm token
# (npmjs.com > Access Tokens) - every publish after that authenticates by
# OIDC, no secret in this repository at all. Requires npm CLI 11.5.1+ and
# Node 22.14.0+ (setup-node below), and package.json's repository.url to
# match this repo exactly (it does).
name: publish-cli

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch: # run from a cli-v* tag

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC); unused until configured on npm's side

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'cli-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches cli/package.json
        run: |
          want="${GITHUB_REF_NAME#cli-v}"
          have=$(node -p "require('./cli/package.json').version")
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but cli/package.json is version $have"
            exit 1
          fi

      - name: CLI tests
        run: TEST_SLOT=0 ./test.sh cli

      - name: Reclaim files the containerized tests wrote as root
        # cli/test.sh runs npm ci and tsc for the CLI itself in a plain
        # `docker run` container (no --user), so cli/node_modules and
        # cli/dist come back owned by root on a GitHub-hosted runner's
        # real Docker - invisible with rootless podman locally, which
        # remaps container-root to the host user itself. The next step's
        # npm ci, run directly on the runner, can't even rmdir
        # node_modules/.bin to reinstall it otherwise (EACCES).
        run: sudo chown -R "$(id -u):$(id -g)" cli

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Pack (dry run)
        working-directory: cli
        run: |
          npm ci --no-audit --no-fund
          npm pack --dry-run

      - name: Audit (high and critical block the release)
        working-directory: cli
        run: npm audit --audit-level=high

      - name: Publish
        working-directory: cli
        env:
          # setup-node's registry-url wrote an .npmrc reading this var, the
          # standard token fallback for that action. npm tries OIDC (from
          # the id-token permission above) first regardless: once a trusted
          # publisher is configured on npm's side, this env var is never
          # read even if the secret is still set. Empty when NPM_TOKEN
          # isn't set, same as no token configured at all.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
