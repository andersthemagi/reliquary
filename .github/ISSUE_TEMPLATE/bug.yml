name: Bug
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the site footer, or at /version.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [Web UI, MCP (which client?), CLI, Other]
  - type: markdown
    attributes:
      value: Never paste secrets, tokens, variable values or client data. Security issues go to andres@redmage.cc (see /security), not here.
