name: Feature or improvement
description: Something Reliquary should do, or do better
labels: ["type: feature", "status: considering"]
body:
  - type: textarea
    id: job
    attributes:
      label: What are you trying to do?
      description: The job, not the solution. Who, and why it matters.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
  - type: textarea
    id: idea
    attributes:
      label: What would good look like?
  - type: markdown
    attributes:
      value: Never paste secrets, tokens or client data here.
