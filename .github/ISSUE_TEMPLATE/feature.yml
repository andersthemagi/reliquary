name: Feature or improvement
description: Something Reliquary should do, or do better
labels: ["type: feature", "status: considering"]
body:
  - type: textarea
    id: job
    attributes:
      label: What are you trying to do?
      description: The job, not the solution. Who, and why it matters.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
  - type: textarea
    id: idea
    attributes:
      label: What would good look like?
  - type: dropdown
    id: build
    attributes:
      label: Would you like to build it?
      description: Optional. If it's a fit, the maintainer moves it to Planned and it's yours.
      options:
        - "Yes, I'd like to open the pull request"
        - "Maybe, with some pointers"
        - "No, just suggesting"
  - type: markdown
    attributes:
      value: Never paste secrets, tokens or client data here.
