# Weekly dependency-update pull requests, one per package (each tests
# itself through test.yml/security.yml before it's mergeable). Security
# fixes for known vulnerabilities are separate (vulnerability-alerts,
# automated-security-fixes: both on via the API, 2026-09-29) and land
# faster than this weekly cadence; this covers routine version drift.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
