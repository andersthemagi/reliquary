# Reliquary's public roadmap: the source of /roadmap and /docs/roadmap.
#
# One item per "- title:". Keys: title, summary (one line), status (shipped,
# in-progress, planned or considering), and optionally milestone (M1 to M7,
# docs/design.md's build order), issue (a number), docs (a docs page's slug,
# like concepts/variables) and version (the release it shipped in).
# Shipping a feature moves its item to shipped in the same change.
# Quote a value that holds ": " or starts with a symbol. The build
# (web/scripts/gen-docs.mjs) and web/test/docs.test.mjs check this file.

# Shipped ------------------------------------------------------------------

- title: Vaults, files and folders
  summary: Shared vaults of versioned text files for people and their agents, with search.
  status: shipped
  milestone: M1
  docs: concepts/vaults-and-files
  version: 0.1.0

- title: Canon and open files with rules and quorum
  summary: Canon files change only when enough people approve; open files are written directly.
  status: shipped
  milestone: M1
  docs: concepts/canon-and-rules
  version: 0.1.0

- title: Proposals and review
  summary: Approve, request changes, reject or edit then approve, with diffs, threads and snooze.
  status: shipped
  milestone: M1
  docs: concepts/proposals-and-review
  version: 0.1.0

- title: Remote MCP endpoint with OAuth
  summary: One MCP URL for Claude Code, Claude.ai, ChatGPT, Cursor and any MCP client.
  status: shipped
  milestone: M1
  docs: reference/mcp-tools
  version: 0.1.0

- title: Scoped, expiring access tokens
  summary: Connections limited to chosen vaults, read-only or read-write, always expiring.
  status: shipped
  milestone: M1
  docs: concepts/connections
  version: 0.1.0

- title: The agent ceiling, enforced in the database
  summary: Agents act as their person but can never approve, manage members, reveal secrets or delete.
  status: shipped
  milestone: M1
  docs: concepts/agents
  version: 0.1.0

- title: Activity and history
  summary: An append-only log of every change, filterable, across vaults or per file.
  status: shipped
  milestone: M1
  docs: concepts/activity
  version: 0.1.0

- title: Vault settings, export, delete and erase
  summary: Rename a vault, export it as a tar.gz, delete it at once, or erase one file's text.
  status: shipped
  milestone: M1
  docs: concepts/export-delete-erase
  version: 0.1.0

- title: Members and invites
  summary: Invite by email with a role, change roles, remove members, leave a vault.
  status: shipped
  milestone: M1
  docs: concepts/members
  version: 0.1.0

- title: Environment variables
  summary: Encrypted variables per environment, revealed only to people and logged on every access.
  status: shipped
  milestone: M2
  docs: concepts/variables
  version: 0.1.0

- title: The Reliquary CLI
  summary: reliquary run and env pull deliver variables to a process or a gitignored .env.
  status: shipped
  milestone: M2
  docs: reference/cli
  version: 0.1.0

- title: .env imports
  summary: Paste a .env or push one from the CLI; a person applies it in the web app.
  status: shipped
  milestone: M2
  docs: concepts/imports
  version: 0.1.0

- title: Key rotation and custom environments
  summary: Rotate the encryption key without downtime; owners add their own environments.
  status: shipped
  milestone: M2
  docs: concepts/variables
  version: 0.1.0

- title: Versioned releases
  summary: Each release is tagged with a changelog; the footer and /version say which one is running.
  status: shipped
  docs: changelog
  version: 0.1.0

- title: Public docs and roadmap
  summary: Docs for people and agents at /docs, with llms.txt and every page as Markdown.
  status: shipped
  docs: index

- title: Onboarding templates
  summary: Start a vault as a client engagement, personal projects or a product team, with folders, rules and a README for agents.
  status: shipped
  milestone: M1
  docs: concepts/templates

- title: OS keychain for the CLI
  summary: The Reliquary CLI's connection kept in the macOS Keychain, the Secret Service on Linux or DPAPI on Windows, else a file.
  status: shipped
  milestone: M2
  docs: reference/cli

- title: The CLI on Windows and macOS
  summary: reliquary run starts npm, npx and pnpm shims on Windows, and the CLI's tests run on Linux, macOS and Windows.
  status: shipped
  milestone: M2
  docs: reference/cli

- title: Rate limits on sign-in and MCP
  summary: Limits per address, email, session, client, token and Reliquary CLI connection on sign-in, OAuth, invites, MCP, the env API and forms.
  status: shipped
  docs: reference/limits

- title: Move to reliquary.redmage.cc
  summary: The website and docs at reliquary.redmage.cc, the web app at app.reliquary.redmage.cc and MCP at mcp.reliquary.redmage.cc; clients sign in again once.
  status: shipped

- title: Plans and limits
  summary: Account plans limit the vaults you own; each vault's tier limits its people and storage, with usage in Account and Settings.
  status: shipped
  docs: concepts/plans-and-limits

- title: Invite-only accounts
  summary: During the alpha an account creates vaults once it joins a vault by invite or the operator admits it.
  status: shipped
  docs: concepts/plans-and-limits

- title: Inbox, search and account settings
  summary: A top bar with a vault switcher, search across your vaults, an inbox of what needs you, and display names in Account settings.
  status: shipped
  milestone: M1
  docs: concepts/inbox-and-account

- title: Sign out everywhere
  summary: End every browser session of your account at once from Account settings, and optionally revoke all your connections too.
  status: shipped
  docs: concepts/inbox-and-account

- title: Change your email address
  summary: Move your account to another address from Account settings, confirmed by a link; your vaults, roles and connections stay.
  status: shipped
  docs: concepts/inbox-and-account

- title: Delete your account
  summary: Delete your account yourself from Account settings; what you wrote stays in its vaults, shown as a deleted account.
  status: shipped
  docs: how-to/delete-your-account

- title: Feedback and bug reports
  summary: Send a bug, an idea or a question from the top bar's Feedback button or through your agent, and see its status and the reply.
  status: shipped
  docs: how-to/send-feedback

- title: Welcome tour
  summary: A six-step slideshow the first time you sign in, and any time from the account menu.
  status: shipped
  docs: how-to/take-the-welcome-tour

- title: Discovering a link's tools
  summary: Adding a link calls the upstream server's own tool list and stores each tool's name, description and whether it writes, ready to grant once the MCP proxy exists.
  status: shipped
  milestone: M3
  docs: concepts/links

- title: Links
  summary: A vault's credential to a remote MCP server. An owner adds one, grants its tools per role, and an agent calls a granted tool over MCP, the credential attached server-side.
  status: shipped
  milestone: M3
  docs: concepts/links

- title: The MCP proxy for links
  summary: An agent calls a link's granted tools as <link>.<tool>; Reliquary attaches the credential server-side, and the agent never sees it.
  status: shipped
  milestone: M3
  docs: concepts/links

# In progress --------------------------------------------------------------

- title: A week of real use for the core
  summary: One vault used from ChatGPT, Claude Code and Hermes for a week, canon approved in the browser.
  status: in-progress
  milestone: M1

- title: A week of real use for variables
  summary: Projects run with reliquary run and no local .env for a week.
  status: in-progress
  milestone: M2

- title: Email from the product domain
  summary: Sign-in codes and invites sent by email from Reliquary's own domain.
  status: in-progress

- title: Self-hosting (preview)
  summary: Run Reliquary on your own server with Docker Compose, with no plan limits. The server's license is still being decided.
  status: in-progress
  docs: how-to/self-host

- title: Path ownership
  summary: Named owners write, approve, edit-and-approve and comment on their own path directly; everyone else still proposes. Owners name them from Rules in the web app.
  status: shipped
  docs: concepts/path-ownership

- title: Flags
  summary: Telling you and each agent what changed since you were last told, thread messages included. Live over MCP, with a Flags page and Watch/Unwatch in the web app; addressed notes aren't built yet.
  status: in-progress
  docs: concepts/flags

- title: Threads
  summary: Conversations inside a vault between its members and their agents, never private; a side thread is addressed to some members. The database holds them; no MCP tool or web page reaches them yet.
  status: in-progress
  docs: concepts/threads

- title: Compare-and-swap writes
  summary: A write or delete against a stale version refuses instead of overwriting someone else's edit. The web editor does this automatically; agents pass expected_version.
  status: shipped
  docs: concepts/vaults-and-files

- title: Claims
  summary: A lease saying who's working a path, and for how long. Agents claim, renew, release and list claims over MCP; a person sees and breaks one, and sets how long they last by path, in the web app.
  status: shipped
  docs: concepts/claims

- title: Work plans
  summary: Steps with dependencies in a plan file, so no agent is handed a step before the ones blocking it are done. The database can register, claim and complete one; no MCP tool or web page reaches it yet.
  status: in-progress
  docs: concepts/claims

# Planned ------------------------------------------------------------------

- title: Publish the CLI to npm
  summary: "@reliquary-ai/cli on npm, so npx works everywhere without a checkout."
  status: planned

- title: Routines
  summary: Declarative automations on a schedule or a change, running with nobody's machine on.
  status: planned
  milestone: M4

- title: Routine watchdog
  summary: Missed, failed and timed-out runs are recorded and their owner is told.
  status: planned
  milestone: M4

- title: Per-member variable grants
  summary: Choose which members may use which environments, beyond their role.
  status: planned
  milestone: M5

- title: Credential requests
  summary: Ask a client for named credentials; they fill a form instead of emailing them.
  status: planned
  milestone: M5

- title: Emergency access
  summary: A trusted member can request owner access, granted after a waiting period unless declined.
  status: planned
  milestone: M5

- title: Git mirror
  summary: Every canon change committed to a git remote you choose, one way by default.
  status: planned
  milestone: M6

- title: Version history and restore
  summary: Browse a file's earlier versions and restore one.
  status: planned
  milestone: M6

- title: Fuller export
  summary: Exports with the log, earlier versions and proposals, and reliquary export from the CLI.
  status: planned
  milestone: M6

- title: Chat surfaces
  summary: Use a vault from a group chat, starting with Telegram, showing only what everyone present may see.
  status: planned
  milestone: M7

# Considering --------------------------------------------------------------

- title: Billing and plans
  summary: Paying for a bigger plan or a Pro vault through a merchant of record. Plans and limits exist; for now the operator grants them by hand.
  status: considering

- title: Public status page
  summary: Uptime of the web app, the MCP endpoint and the database, in public.
  status: considering

- title: Client-side encrypted variables
  summary: Values only your members' keys can open, so the operator can't decrypt them.
  status: considering

- title: Semantic search
  summary: Find files by meaning, not only by shared words.
  status: considering

- title: Approver groups
  summary: Beyond path ownership's one owner list per path, multiple named groups each needing their own approval, like one from legal and one from engineering.
  status: considering

- title: Member names over MCP
  summary: Let agents address co-members by display name, without learning email addresses.
  status: considering

- title: Service agents
  summary: Headless agents with their own grants that belong to the vault, not a person.
  status: considering

- title: SSO
  summary: Sign in through your company's identity provider.
  status: considering
